<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>入口不存在</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #eaf0f5; background: #0b0d15; font-family: Inter, "Microsoft YaHei", "PingFang SC", sans-serif; }
    main { width: min(520px, 100%); border-top: 1px solid #2dd4bf; border-bottom: 1px solid #28323f; padding: 42px 4px; }
    small { color: #2dd4bf; font: 700 11px Consolas, monospace; }
    h1 { margin: 16px 0 12px; font-size: 32px; letter-spacing: 0; }
    p { margin: 0; color: #8999aa; font-size: 14px; line-height: 1.8; }
  </style>
</head>
<body>
  <main>
    <small>404 / ENTRANCE NOT FOUND</small>
    <h1>入口不存在</h1>
    <p>请检查访问地址是否完整。</p>
  </main>
</body>
</html>
