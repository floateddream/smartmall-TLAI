name: smartmall-tlai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartmall}
      POSTGRES_USER: ${POSTGRES_USER:-smartmall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256m
    mem_limit: 768m
    cpus: 0.55
    networks: [data]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 deploy/.env 中设置 REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory 192mb --maxmemory-policy noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 10s
    mem_limit: 256m
    cpus: 0.20
    networks: [data]
    logging: *default-logging

  minio:
    image: ${MINIO_IMAGE:-smartmall/minio:RELEASE.2025-10-15T17-29-55Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 deploy/.env 中设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 deploy/.env 中设置 MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    cpus: 0.30
    networks: [data]
    logging: *default-logging

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 deploy/.env 中设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 deploy/.env 中设置 MINIO_ROOT_PASSWORD}
      SMARTMALL_MINIO_BUCKET: ${SMARTMALL_MINIO_BUCKET:-smartmall-documents}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$SMARTMALL_MINIO_BUCKET"
    mem_limit: 64m
    cpus: 0.10
    networks: [data]
    logging: *default-logging

  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    image: smartmall-tlai-backend:${SMARTMALL_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      SPRING_PROFILES_ACTIVE: production
      SMARTMALL_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smartmall}
      SMARTMALL_DB_USERNAME: ${POSTGRES_USER:-smartmall}
      SMARTMALL_DB_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 中设置 POSTGRES_PASSWORD}
      SMARTMALL_REDIS_HOST: redis
      SMARTMALL_REDIS_PORT: 6379
      SMARTMALL_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 deploy/.env 中设置 REDIS_PASSWORD}
      SMARTMALL_MINIO_ENDPOINT: http://minio:9000
      SMARTMALL_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?请在 deploy/.env 中设置 MINIO_ROOT_USER}
      SMARTMALL_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?请在 deploy/.env 中设置 MINIO_ROOT_PASSWORD}
      SMARTMALL_MINIO_BUCKET: ${SMARTMALL_MINIO_BUCKET:-smartmall-documents}
      SMARTMALL_JWT_SECRET: ${SMARTMALL_JWT_SECRET:?请设置至少 32 字节随机 JWT 密钥}
      SMARTMALL_AI_MASTER_KEY: ${SMARTMALL_AI_MASTER_KEY:?请设置至少 32 字节随机 AI 主密钥}
      SMARTMALL_CORS_ALLOWED_ORIGINS: ${SMARTMALL_CORS_ALLOWED_ORIGINS:?请设置生产站点 Origin}
      SMARTMALL_BOOTSTRAP_ADMIN_ENABLED: "false"
      JAVA_OPTS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8
    mem_limit: 1280m
    cpus: 0.75
    networks: [edge, data]
    logging: *default-logging

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    image: smartmall-tlai-frontend:${SMARTMALL_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
    mem_limit: 128m
    cpus: 0.10
    networks: [edge]
    logging: *default-logging

networks:
  edge:
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
