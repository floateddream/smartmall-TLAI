server {
    listen 80;
    server_name _;
    server_tokens off;
    # CentOS 7 的旧内核通过 Docker overlay2 发送较大的静态文件时，
    # sendfile 可能导致响应被截断，浏览器会报 ERR_CONTENT_LENGTH_MISMATCH。
    sendfile off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 根地址不推测登录入口；只有持有完整登录地址的访问者才能看到登录页。
    location = / {
        error_page 404 =404 /entry-not-found.html;
        return 404;
    }

    location = /entry-not-found.html {
        internal;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
